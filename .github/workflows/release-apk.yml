name: Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify expo-audio patch is compiled
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if ! unzip -p "$apk" 'classes*.dex' | grep -aq 'NoisyAudioReceiver'; then
            echo 'NoisyAudioReceiver is missing: expo-audio was not compiled from patched source.' >&2
            exit 1
          fi

      - name: Stage release asset
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/SoundShelf-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*.apk
